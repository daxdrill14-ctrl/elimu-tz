<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElimuHub TZ - O-Level, A-Level & VETA</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, var(--bg-dark));
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 18px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box input {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid var(--border-glass);
            background: var(--card-bg);
            color: white;
            width: 260px;
            max-width: 100%;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .hero {
            text-align: center;
            padding: 35px 5% 18px;
        }

        .hero h1 {
            font-size: 1.85rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 22px;
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            padding: 0 5%;
        }

        .tab-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0b0f19;
            border-color: transparent;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 18px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
            width: fit-content;
        }

        .badge.olevel { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge.alevel { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .badge.veta { background: rgba(52, 211, 153, 0.2); color: #34d399; }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 18px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-read {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-download {
            background: var(--primary);
            color: #0b0f19;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ElimuHub TZ</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tafuta somo, fani, au past paper...">
        </div>
    </header>

    <section class="hero">
        <h1>Jukwaa la Kujisomea Kidijitali</h1>
        <p>Rasilimali za masomo kwa ngazi ya O-Level, A-Level, na VETA sehemu moja.</p>
    </section>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterMaterials('all', this)">Zote</button>
        <button class="tab-btn" onclick="filterMaterials('olevel', this)">O-Level (Form 1-4)</button>
        <button class="tab-btn" onclick="filterMaterials('alevel', this)">A-Level (Form 5-6)</button>
        <button class="tab-btn" onclick="filterMaterials('veta', this)">VETA (NVA 1-3)</button>
    </div>

    <div class="container" id="materialsGrid"></div>

    <script>
        const materials = [
            {
                title: "Physics Form 3 - Complete Notes",
                level: "olevel",
                levelName: "O-Level",
                desc: "Mada kuu za Form 3 ikiwemo Light, Friction, na Thermal Expansion.",
                fileUrl: "materials/o-level/physics-f3.pdf"
            },
            {
                title: "Basic Mathematics NECTA Past Paper",
                level: "olevel",
                levelName: "O-Level",
                desc: "Mazoezi ya mitihani ya taifa na mbinu za kujibu maswali.",
                fileUrl: "materials/o-level/math-necta.pdf"
            },
            {
                title: "Advanced Chemistry - Organic",
                level: "alevel",
                levelName: "A-Level",
                desc: "Notes za Organic Chemistry (Form 5 & 6) zenye mifano ya maswali.",
                fileUrl: "materials/a-level/organic-chem.pdf"
            },
            {
                title: "ACSEE Pure Mathematics",
                level: "alevel",
                levelName: "A-Level",
                desc: "Mkusanyiko wa maswali ya Pure Maths na miongozo ya majibu.",
                fileUrl: "materials/a-level/pure-math.pdf"
            },
            {
                title: "Electrical Installation - NVA Level 2",
                level: "veta",
                levelName: "VETA",
                desc: "Misingi ya wiring na maandalizi ya mitihani ya CBA.",
                fileUrl: "materials/veta/electrical-nva2.pdf"
            },
            {
                title: "Motor Vehicle & Pipe Fitting CBA",
                level: "veta",
                levelName: "VETA",
                desc: "Miongozo ya vitendo (Practicals) na maswali ya majaribio.",
                fileUrl: "materials/veta/veta-cba.pdf"
            }
        ];

        const grid = document.getElementById('materialsGrid');
        const searchInput = document.getElementById('searchInput');
        let currentCategory = 'all';

        function renderCards() {
            const query = searchInput.value.toLowerCase();
            grid.innerHTML = '';

            const filtered = materials.filter(item => {
                const matchesCat = currentCategory === 'all' || item.level === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#94a3b8;">Hakuna somo lililopatikana.</p>';
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="badge ${item.level}">${item.levelName}</span>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>
                        <div class="card-actions">
                            <a href="${item.fileUrl}" target="_blank" class="btn btn-read">Soma</a>
                            <a href="${item.fileUrl}" download class="btn btn-download">Pakua</a>
                        </div>
                    </div>
                `;
            });
        }

        function filterMaterials(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderCards();
        }

        searchInput.addEventListener('input', renderCards);
        renderCards();
    </script>
</body>
</html>
