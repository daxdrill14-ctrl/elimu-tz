<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SikionBeats - Pakua Nyimbo & Beats</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.12);
            --neon-cyan: #00f2fe;
            --neon-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-dark));
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 110px;
        }

        header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box input {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid var(--border-glass);
            background: var(--card-bg);
            color: white;
            width: 260px;
            max-width: 100%;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--neon-cyan);
        }

        .hero {
            text-align: center;
            padding: 32px 5% 18px;
        }

        .hero h1 {
            font-size: 1.85rem;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.92rem;
            max-width: 560px;
            margin: 0 auto 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
            padding: 0 5%;
        }

        .tab-btn {
            padding: 9px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #090d16;
            border-color: transparent;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 18px;
        }

        .song-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .song-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
        }

        .genre-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(0, 242, 254, 0.14);
            color: var(--neon-cyan);
            margin-bottom: 10px;
            width: fit-content;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .artist-name {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 9px;
            border-radius: 9px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn-play {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--neon-cyan), #4facfe);
            color: #090d16;
        }

        .now-playing-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.94);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-glass);
            padding: 10px 5%;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .now-playing-info {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        audio {
            width: 100%;
            height: 36px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SikionBeats</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tafuta wimbo, msanii, au beat...">
        </div>
    </header>

    <section class="hero">
        <h1>Sikiliza na Pakua Nyimbo</h1>
        <p>Mkusanyiko wa ngoma, beats/instrumentals, na nyimbo mbalimbali za kupakua moja kwa moja.</p>
    </section>

    <div class="tabs">
        <button class="tab-btn active" onclick="setGenre('all', this)">Zote</button>
        <button class="tab-btn" onclick="setGenre('bongo', this)">Bongo Flava</button>
        <button class="tab-btn" onclick="setGenre('beats', this)">Beats / Instrumentals</button>
        <button class="tab-btn" onclick="setGenre('intl', this)">International</button>
    </div>

    <div class="container" id="songsGrid"></div>

    <div class="now-playing-bar">
        <div class="now-playing-info" id="nowPlayingText">Chagua wimbo kusikiliza...</div>
        <audio id="mainAudioPlayer" controls></audio>
    </div>

    <script>
        const songs = [
            {
                title: "Mfano wa Wimbo 1",
                artist: "Msanii A",
                genre: "bongo",
                genreLabel: "Bongo Flava",
                url: "songs/wimbo1.mp3"
            },
            {
                title: "Faded Style Beat",
                artist: "Sikion Prod",
                genre: "beats",
                genreLabel: "Beats / Instrumentals",
                url: "songs/faded-beat.mp3"
            },
            {
                title: "Night Drive Mix",
                artist: "Various Artists",
                genre: "intl",
                genreLabel: "International",
                url: "songs/night-drive.mp3"
            }
        ];

        const grid = document.getElementById('songsGrid');
        const searchInput = document.getElementById('searchInput');
        const audioPlayer = document.getElementById('mainAudioPlayer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        let activeGenre = 'all';

        function renderSongs() {
            const q = searchInput.value.toLowerCase();
            grid.innerHTML = '';

            const list = songs.filter(s => {
                const matchGenre = activeGenre === 'all' || s.genre === activeGenre;
                const matchText = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
                return matchGenre && matchText;
            });

            if (!list.length) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#94a3b8;">Hakuna wimbo uliopatikana.</p>';
                return;
            }

            list.forEach((song, idx) => {
                grid.innerHTML += `
                    <div class="song-card">
                        <div>
                            <span class="genre-tag">${song.genreLabel}</span>
                            <div class="song-title">${song.title}</div>
                            <div class="artist-name">${song.artist}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-play" onclick="playSong(${idx})">▶ Sikiliza</button>
                            <a href="${song.url}" download class="btn btn-download">⬇ Pakua</a>
                        </div>
                    </div>
                `;
            });
        }

        function playSong(index) {
            const song = songs[index];
            if (!song) return;
            audioPlayer.src = song.url;
            audioPlayer.play();
            nowPlayingText.textContent = "Inacheza sasa: " + song.title + " — " + song.artist;
        }

        function setGenre(genre, btn) {
            activeGenre = genre;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderSongs();
        }

        searchInput.addEventListener('input', renderSongs);
        renderSongs();
    </script>
</body>
</html>
