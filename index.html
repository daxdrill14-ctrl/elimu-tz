<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SikionBeats - YouTube Music Hub</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.12);
            --neon-cyan: #00f2fe;
            --neon-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-dark));
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 230px;
        }

        header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box input {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid var(--border-glass);
            background: var(--card-bg);
            color: white;
            width: 260px;
            max-width: 100%;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--neon-cyan);
        }

        .hero {
            text-align: center;
            padding: 32px 5% 18px;
        }

        .hero h1 {
            font-size: 1.85rem;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.92rem;
            max-width: 580px;
            margin: 0 auto 20px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
            padding: 0 5%;
        }

        .tab-btn {
            padding: 9px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #090d16;
            border-color: transparent;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 18px;
        }

        .song-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .song-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background: #111827;
        }

        .genre-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(0, 242, 254, 0.14);
            color: var(--neon-cyan);
            margin-bottom: 8px;
            width: fit-content;
        }

        .song-title {
            font-size: 1.08rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .artist-name {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 9px;
            border-radius: 9px;
            border: none;
            font-weight: 600;
            font-size: 0.84rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn-play {
            background: linear-gradient(135deg, var(--neon-cyan), #4facfe);
            color: #090d16;
        }

        .btn-yt {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .player-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.96);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-glass);
            padding: 10px 5%;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .player-meta {
            flex: 1;
            min-width: 180px;
        }

        .player-status {
            font-size: 0.88rem;
            color: var(--neon-cyan);
            font-weight: 600;
        }

        .player-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .yt-frame-box {
            width: 220px;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-glass);
        }

        .yt-frame-box iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SikionBeats</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tafuta wimbo, msanii, au beat...">
        </div>
    </header>

    <section class="hero">
        <h1>Sikiliza Nyimbo Kutoka YouTube</h1>
        <p>Chagua wimbo au beat upate kusikiliza moja kwa moja ndani ya website bila kujaza storage ya GitHub.</p>
    </section>

    <div class="tabs">
        <button class="tab-btn active" onclick="setGenre('all', this)">Zote</button>
        <button class="tab-btn" onclick="setGenre('bongo', this)">Bongo Flava</button>
        <button class="tab-btn" onclick="setGenre('beats', this)">Beats / Instrumentals</button>
        <button class="tab-btn" onclick="setGenre('intl', this)">International</button>
    </div>

    <div class="container" id="songsGrid"></div>

    <div class="player-dock">
        <div class="yt-frame-box">
            <iframe
                id="ytPlayer"
                src="https://www.youtube.com/embed/jfKfPfyJRdk?rel=0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
        <div class="player-meta">
            <div class="player-status" id="nowPlayingTitle">Chagua wimbo wa kuanza kusikiliza</div>
            <div class="player-sub" id="nowPlayingArtist">YouTube Player</div>
        </div>
    </div>

    <script>
        // Weka YouTube Video ID ya kila wimbo hapa (mfano: kutoka youtu.be/VIDEO_ID au watch?v=VIDEO_ID)
        const songs = [
            {
                title: "Bongo Vibe Mix",
                artist: "Bongo Flava Selection",
                genre: "bongo",
                genreLabel: "Bongo Flava",
                ytId: "jfKfPfyJRdk"
            },
            {
                title: "Chill Instrumental Beat",
                artist: "Beats & Instrumentals",
                genre: "beats",
                genreLabel: "Beats / Instrumentals",
                ytId: "5qap5aO4i9A"
            },
            {
                title: "Late Night Acoustic",
                artist: "International Mix",
                genre: "intl",
                genreLabel: "International",
                ytId: "DWcJFNfaw9c"
            }
        ];

        const grid = document.getElementById('songsGrid');
        const searchInput = document.getElementById('searchInput');
        const ytPlayer = document.getElementById('ytPlayer');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingArtist = document.getElementById('nowPlayingArtist');
        let activeGenre = 'all';

        function renderSongs() {
            const q = searchInput.value.toLowerCase();
            grid.innerHTML = '';

            const list = songs.filter(s => {
                const matchGenre = activeGenre === 'all' || s.genre === activeGenre;
                const matchText = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
                return matchGenre && matchText;
            });

            if (!list.length) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#94a3b8;">Hakuna wimbo uliopatikana.</p>';
                return;
            }

            list.forEach((song) => {
                const thumbUrl = `https://img.youtube.com/vi/${song.ytId}/hqdefault.jpg`;
                const watchUrl = `https://www.youtube.com/watch?v=${song.ytId}`;

                grid.innerHTML += `
                    <div class="song-card">
                        <div>
                            <img src="${thumbUrl}" alt="${song.title}" class="thumb" loading="lazy">
                            <span class="genre-tag">${song.genreLabel}</span>
                            <div class="song-title">${song.title}</div>
                            <div class="artist-name">${song.artist}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-play" onclick="playYtSong('${song.ytId}', '${escapeJs(song.title)}', '${escapeJs(song.artist)}')">▶ Cheza</button>
                            <a href="${watchUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-yt">YouTube ↗</a>
                        </div>
                    </div>
                `;
            });
        }

        function escapeJs(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function playYtSong(ytId, title, artist) {
            ytPlayer.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
            nowPlayingTitle.textContent = "Inacheza: " + title;
            nowPlayingArtist.textContent = artist;
        }

        function setGenre(genre, btn) {
            activeGenre = genre;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderSongs();
        }

        searchInput.addEventListener('input', renderSongs);
        renderSongs();
    </script>
</body>
</html>
